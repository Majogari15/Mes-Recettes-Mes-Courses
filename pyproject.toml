[tool.pytest.ini_options]
# Filet de sécurité contre le flake Tcl/Tk connu (callback orphelin après
# destruction rapide de fenêtres pendant les tests -> boîte de dialogue
# bloquante -> pytest attend indéfiniment un clic qui ne viendra jamais sous
# Xvfb/CI). Sans ce timeout, un seul test touché bloque tout le job CI (déjà
# vu : un run Ubuntu resté figé 12+ minutes sur "Run tests with xvfb").
# "thread" (et non le "signal" par défaut) car "signal" est indisponible sur
# Windows, l'un des deux OS de la matrice CI.
timeout = 60
timeout_method = "thread"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Sélection EXPLICITE plutôt que la sélection "par défaut" de ruff : celle-ci
# s'est révélée changer d'une version à l'autre (0.15.8 en local ne
# signalait que E/F classiques ; 0.16.8 sur la CI active en plus tout un tas
# de catégories — BLE, FURB, PERF, PIE, UP, RUF, I, YTT... — donnant 328
# signalements au lieu de 0 pour un code identique). E/F (pycodestyle +
# pyflakes) reste stable et suffisant pour attraper de vrais bugs.
select = ["E", "F"]
# Exclusions pour un style délibérément dense déjà en place dans tout le
# projet (plusieurs instructions par ligne, lignes longues) : les activer
# produirait ~1600 signalements purement stylistiques sans rapport avec de
# vrais bugs.
ignore = [
    "E701",  # instructions multiples sur une ligne (deux-points)
    "E702",  # instructions multiples sur une ligne (point-virgule)
    "E501",  # ligne trop longue
    "E401",  # imports multiples sur une ligne ("import os, sys")
    "E402",  # import pas en tête de fichier — nécessaire dans certains tests
             # qui font sys.path.insert(...) avant "import main"
]
