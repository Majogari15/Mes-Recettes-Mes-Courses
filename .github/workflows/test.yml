name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Version épinglée : un premier essai avec "pip install ruff" (sans
      # version) a pris la 0.16.8 alors que la config avait été testée avec
      # la 0.15.8 — la sélection de règles "par défaut" de ruff a changé
      # entre les deux, donnant 328 signalements au lieu de 0 pour un code
      # identique. pyproject.toml sélectionne maintenant les règles
      # explicitement (donc les deux versions sont propres), mais autant
      # épingler comme le reste des dépendances du projet.
      - name: Install ruff
        run: pip install ruff==0.16.8
      # Configuration dans pyproject.toml : sélectionne explicitement E/F,
      # en ignorant les règles de style (lignes/instructions multiples,
      # longueur) déjà en place partout dans ce projet, pour ne signaler que
      # de vrais problèmes (imports inutilisés, except nu, variable ambiguë...).
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matrice réduite de 6 à 2 combinaisons (une par OS, sur la version la
        # plus récente) : les runners hébergés GitHub Actions se bloquaient
        # au démarrage plusieurs fois par session (surtout sur les jambes
        # 3.10/3.11), obligeant à annuler/relancer manuellement à répétition
        # — un vrai bug de leur infrastructure (le même job réussit
        # instantanément à la relance, code identique), pas un problème de
        # compatibilité Python détecté par ces jambes. Réduit d'autant le
        # temps CI et le risque de tomber sur un runner coincé. À élargir de
        # nouveau si un jour un problème spécifique à 3.10/3.11 est suspecté.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tesseract-ocr tesseract-ocr-fra python3-tk libzbar0

      # Les builds Python hébergés par actions/setup-python n'incluent pas
      # toujours Tcl/Tk selon la plateforme et la version : ce contrôle
      # échoue vite et clairement (message explicite) plutôt que de
      # laisser un échec confus plus loin dans la collecte des tests.
      # Si ce contrôle échoue un jour, une piste est d'utiliser le python3
      # système d'Ubuntu (qui a bien Tcl/Tk via python3-tk) à la place de
      # celui fourni par setup-python pour cette combinaison.
      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter OK, version', tkinter.TkVersion)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with xvfb (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a python -m pytest tests/ -v --cov=main --cov-report=xml

      # Sur les runners Windows hébergés, le dossier Tcl/Tk venant d'être
      # écrit dans le hostedtoolcache est parfois encore verrouillé par un
      # scan antivirus au moment où pytest crée sa première fenêtre Tk,
      # ce qui produit une erreur Tcl transitoire ("couldn't read file
      # ...: No error") alors que le même fichier est lisible l'instant
      # d'après (l'étape "Verify tkinter is available" plus haut a réussi
      # sur la même machine quelques secondes avant). On retente une fois
      # après une courte pause avant d'abandonner ; un second échec reste
      # un vrai échec.
      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m pytest tests/ -v --cov=main --cov-report=xml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Premiere tentative echouee, nouvelle tentative apres une pause (voir commentaire de l'etape pour la cause probable)."
            Start-Sleep -Seconds 10
            python -m pytest tests/ -v --cov=main --cov-report=xml
          }
          exit $LASTEXITCODE

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
